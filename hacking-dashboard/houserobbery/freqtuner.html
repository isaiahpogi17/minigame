<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FREQ TUNER v2.1</title>
  <link rel="stylesheet" href="minigame.css?v=7" />
  <script src="react.production.min.js?v=7"></script>
  <script src="react-dom.production.min.js?v=7"></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
      background: rgba(7, 9, 14, 0.92) !important;
      display: flex; justify-content: center; align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
      transform: translateZ(0); will-change: transform; backface-visibility: hidden;
    }
    #root {
      width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
      transform: translateZ(0);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="minigame-cycle.js?v=1"></script>
  <script src="minigame.js?v=12"></script>
  <script>
    // Trigger FREQ TUNER v2.1 NUI Mode
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        window.dispatchEvent(new MessageEvent('message', {
          data: {
            action: 'open',
            data: { mode: 'tuner', frequency: 104.2, band: '2.4GHz' }
          }
        }));
      }, 100);
    });
  </script>
</body>
</html>
