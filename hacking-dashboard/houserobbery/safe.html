<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interior Safe Cracking Dial</title>
  <script src="react.production.min.js?v=7"></script>
  <script src="react-dom.production.min.js?v=7"></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
      background: rgba(7, 9, 14, 0.92) !important;
      display: flex; justify-content: center; align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
      transform: translateZ(0); will-change: transform; backface-visibility: hidden;
    }
    #safe-root {
      width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
      transform: translateZ(0);
    }
  </style>
</head>
<body>
  <div id="safe-root"></div>

  <script src="safe-minigame.js?v=4"></script>
  <script src="safe-performance.js?v=1"></script>
  <script src="safe-controls.js?v=1"></script>
  <script>
    // Trigger Safe Dial NUI Mode
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        window.dispatchEvent(new MessageEvent('message', {
          data: {
            action: 'safe:open',
            data: {
              combination: [18, 42, 75, 12, 90],
              tolerance: 4,
              timeLimit: 45
            }
          }
        }));
      }, 100);
    });
  </script>
</body>
</html>
