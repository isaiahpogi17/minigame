<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma Cyber-Deck Trainer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-darker: #050811;
            --bg-dark: #090e1a;
            --bg-card: rgba(13, 22, 41, 0.7);
            --bg-card-hover: rgba(22, 37, 69, 0.9);
            --border-neon: #00f0ff;
            --border-neon-glow: rgba(0, 240, 255, 0.4);
            --neon-green: #39ff14;
            --neon-red: #ff0055;
            --neon-purple: #b026ff;
            --text-main: #e2f1ff;
            --text-muted: #7493b8;
            --glow: 0 0 10px var(--border-neon);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-darker);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 168, 204, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(176, 38, 255, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(5, 8, 17, 0.9), rgba(9, 14, 26, 0.95));
            background-size: cover;
            position: relative;
        }

        /* Scanline Overlay Effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            opacity: 0.7;
        }

        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            background: rgba(5, 8, 17, 0.85);
            backdrop-filter: blur(10px);
            z-index: 10;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            font-size: 32px;
            color: var(--border-neon);
            text-shadow: 0 0 12px var(--border-neon);
        }

        .logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--border-neon), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 1px rgba(0, 0, 0, 0.5);
        }

        .header-stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-label {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .stat-value {
            color: var(--border-neon);
            font-weight: bold;
            font-family: 'Fira Code', monospace;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            min-height: calc(100vh - 120px);
        }

        /* Filter Controls */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(9, 14, 26, 0.6);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(13, 22, 41, 0.5);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--border-neon-glow);
            border-color: var(--border-neon);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            color: #fff;
        }

        .search-box {
            position: relative;
            min-width: 300px;
        }

        .search-box input {
            width: 100%;
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 10px 15px 10px 40px;
            border-radius: 4px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--border-neon);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Grid of Minigames */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 8px;
            padding: 25px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(5px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .game-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--border-neon), var(--neon-purple));
            opacity: 0.5;
            transition: all 0.3s;
        }

        .game-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-5px);
            border-color: var(--border-neon);
            box-shadow: 0 10px 25px rgba(0, 240, 255, 0.15);
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            font-size: 24px;
            color: var(--border-neon);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .game-card:hover .card-icon {
            animation: pulse 1s infinite alternate;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .card-source-badge {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .badge-glitch {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-neon);
            color: var(--border-neon);
        }

        .badge-hacking {
            background: rgba(176, 38, 255, 0.1);
            border: 1px solid var(--neon-purple);
            color: var(--neon-purple);
        }

        .badge-minigames {
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }

        .badge-pulling {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
            font-size: 11px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
        }

        .info-label {
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            font-weight: bold;
        }

        .info-value.boosting-target {
            color: #fbbf24;
            text-shadow: 0 0 4px rgba(251, 191, 36, 0.2);
        }

        /* Config Drawer Modal / Sidebar */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            justify-content: flex-end;
        }

        .drawer {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: #080d1a;
            border-left: 1px solid var(--border-neon);
            box-shadow: -10px 0 30px rgba(0, 240, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 30px;
            position: relative;
            z-index: 101;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow-y: auto;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 15px;
        }

        .drawer-title-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .drawer-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: #fff;
            letter-spacing: 1px;
        }

        .drawer-subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--border-neon);
        }

        .close-drawer {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-drawer:hover {
            color: var(--neon-red);
        }

        .drawer-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            border-left: 2px solid var(--border-neon);
            padding-left: 10px;
        }

        .preset-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preset-select {
            width: 100%;
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .preset-select:focus {
            border-color: var(--border-neon);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .slider-label {
            color: var(--text-muted);
        }

        .slider-val {
            color: var(--border-neon);
            font-family: 'Fira Code', monospace;
            font-weight: bold;
        }

        .slider-input {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(5, 8, 17, 0.8);
            height: 6px;
            border-radius: 3px;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--border-neon);
            box-shadow: 0 0 6px var(--border-neon);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .slider-input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .launch-btn {
            background: linear-gradient(135deg, var(--border-neon), var(--neon-purple));
            color: #fff;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
            text-transform: uppercase;
            margin-top: auto;
        }

        .launch-btn:hover {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        /* Iframe Simulation Fullscreen Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 8, 17, 0.95);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-darker);
        }

        .simulation-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        .modal-controls {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 1005;
        }

        .modal-btn {
            background: rgba(13, 22, 41, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .modal-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--border-neon);
            color: #fff;
        }

        .modal-btn.close-btn {
            border-color: rgba(255, 0, 85, 0.3);
        }
        .modal-btn.close-btn:hover {
            background: rgba(255, 0, 85, 0.1);
            border-color: var(--neon-red);
        }

        /* Outcome Overlay Screens (Success / Fail overlays) */
        .outcome-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1002;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            animation: fadeIn 0.4s;
        }

        .outcome-overlay.success {
            background: rgba(5, 20, 15, 0.95);
            box-shadow: inset 0 0 100px rgba(57, 255, 20, 0.2);
            border: 2px solid var(--neon-green);
        }

        .outcome-overlay.failure {
            background: rgba(25, 5, 10, 0.95);
            box-shadow: inset 0 0 100px rgba(255, 0, 85, 0.2);
            border: 2px solid var(--neon-red);
        }

        .outcome-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .success .outcome-title {
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.6);
        }

        .failure .outcome-title {
            color: var(--neon-red);
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
        }

        .outcome-subtitle {
            font-size: 16px;
            color: var(--text-main);
            letter-spacing: 2px;
        }

        .outcome-buttons {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }
            100% { transform: scale(1.1); text-shadow: 0 0 20px rgba(0, 240, 255, 0.9); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-microchip-heading"></i>
            <h1>LUMA CYBER-DECK</h1>
        </div>
        <div class="header-stats">
            <div class="stat-item">
                <span class="stat-label">System Bandwidth</span>
                <span class="stat-value">3.2 GB/S</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Nodes Breach Target</span>
                <span class="stat-value">ATM_FLEECA_AMMUNATION_BOOSTING</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Console State</span>
                <span class="stat-value" id="system-clock">00:00:00</span>
            </div>
        </div>
    </header>

    <main>
        <!-- Category Filter & Search -->
        <div class="controls-row">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All Modules</button>
                <button class="filter-btn" data-filter="glitch">Glitch Engine</button>
                <button class="filter-btn" data-filter="hacking">Krtshk Hacking</button>
                <button class="filter-btn" data-filter="minigames">Krtshk Minigames</button>
                <button class="filter-btn" data-filter="pulling">ATM Trainer</button>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="search-input" placeholder="Search modules, targets, or mechanics...">
            </div>
        </div>

        <!-- Modules Grid -->
        <div class="games-grid" id="games-grid">
            <!-- Populated dynamically via JS -->
        </div>
    </main>

    <!-- Settings Drawer (Overlay) -->
    <div class="drawer-overlay" id="drawer-overlay">
        <div class="drawer" id="drawer">
            <div class="drawer-header">
                <div class="drawer-title-group">
                    <span class="drawer-subtitle" id="drawer-module-subtitle">Module Calibration</span>
                    <h2 class="drawer-title" id="drawer-module-title">Needle Balance</h2>
                </div>
                <button class="close-drawer" id="close-drawer"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Presets Section -->
            <div class="drawer-section">
                <span class="section-title">Calibration Presets</span>
                <div class="preset-container">
                    <select class="preset-select" id="preset-select">
                        <!-- Loaded dynamically -->
                    </select>
                </div>
            </div>

            <!-- Parameters Sliders Section -->
            <div class="drawer-section">
                <span class="section-title">Calibration Parameters</span>
                <div class="sliders-container" id="sliders-container">
                    <!-- Sliders injected here -->
                </div>
            </div>

            <button class="launch-btn" id="launch-btn">Execute Simulation</button>
        </div>
    </div>

    <!-- Fullscreen Iframe Game Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-container">
            <div class="modal-controls">
                <button class="modal-btn" id="force-success-btn">Inject Success</button>
                <button class="modal-btn" id="force-failure-btn">Simulate Fail</button>
                <button class="modal-btn close-btn" id="close-modal-btn">Terminate</button>
            </div>
            <iframe class="simulation-iframe" id="simulation-iframe" src=""></iframe>
            
            <!-- Result screens overlays -->
            <div class="outcome-overlay" id="outcome-overlay">
                <h2 class="outcome-title" id="outcome-title">Access Granted</h2>
                <span class="outcome-subtitle" id="outcome-subtitle">Decrypting key files...</span>
                <div class="outcome-buttons">
                    <button class="modal-btn" id="btn-replay">Restart Simulation</button>
                    <button class="modal-btn close-btn" id="btn-close-outcome">Return to Deck</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Database and Controller -->
    <script>
        // Database of games
        const GAMES = [
            // glitch-minigames
            {
                id: "rhythm",
                name: "Circuit Rhythm",
                source: "glitch",
                action: "startRhythm",
                category: "Timing",
                desc: "Timing-based rhythm lanes game where notes cascade down. Synchronize key presses as notes pass through the hit zone.",
                icon: "fa-music",
                boosting: "Ammunation Robbery",
                presets: {
                    "default": { name: "Manual Config", config: { lanes: 4, noteSpeed: 300, noteSpawnRate: 1000, requiredNotes: 20, maxWrongKeys: 5, maxMissedNotes: 3 } },
                    "ammunation": { name: "Ammunation Robbery (Luma Server)", config: { lanes: 6, noteSpeed: 350, noteSpawnRate: 400, requiredNotes: 45, maxWrongKeys: 1, maxMissedNotes: 3 } }
                },
                sliders: [
                    { id: "lanes", label: "Lanes Count", min: 1, max: 6, default: 6 },
                    { id: "noteSpeed", label: "Note Speed (px/s)", min: 50, max: 600, default: 350 },
                    { id: "noteSpawnRate", label: "Spawn Interval (ms)", min: 200, max: 3000, default: 400 },
                    { id: "requiredNotes", label: "Correct Hits to Win", min: 5, max: 60, default: 45 },
                    { id: "maxWrongKeys", label: "Max Wrong Key presses", min: 1, max: 20, default: 1 },
                    { id: "maxMissedNotes", label: "Max Missed Notes", min: 1, max: 20, default: 3 }
                ]
            },
            {
                id: "untangle",
                name: "Untangle Web",
                source: "glitch",
                action: "startUntangle",
                category: "Logic",
                desc: "Node web untangling game. Drag intersecting connections until all lines are clear and do not cross.",
                icon: "fa-project-diagram",
                boosting: "ATM Robbery",

        // Synthesizer using Web Audio API for self-contained premium sound effects
        const soundSystem = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playClick() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            },
            playSuccess() {
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 arpeggio
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.08, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            },
            playFailure() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'sawtooth';
                osc2.type = 'sine';
                osc.frequency.setValueAtTime(130, now); // Low buzz
                osc2.frequency.setValueAtTime(133, now);
                
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                
                osc.start();
                osc2.start();
                osc.stop(now + 0.6);
                osc2.stop(now + 0.6);
            }
        };

        // Render Dashboard
        function renderGames(filterCategory = 'all', searchQuery = '') {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';
            
            const filtered = GAMES.filter(game => {
                const matchesFilter = filterCategory === 'all' || game.source === filterCategory;
                const matchesSearch = searchQuery === '' || 
                    game.name.toLowerCase().includes(searchQuery) ||
                    game.boosting.toLowerCase().includes(searchQuery) ||
                    game.desc.toLowerCase().includes(searchQuery) ||
                    game.category.toLowerCase().includes(searchQuery);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px; border: 1px dashed rgba(0, 240, 255, 0.2); border-radius: 8px;">
                    NO CYBERNETIC MODULES FOUND MATCHING SPECIFIED PROTOCOLS.
                </div>`;
                return;
            }

            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openConfigurator(game.id);

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-group">
                            <i class="fa-solid ${game.icon} card-icon"></i>
                            <span class="card-title">${game.name}</span>
                        </div>
                        <span class="card-source-badge badge-${game.source}">${game.source}</span>
                    </div>
                    <div class="card-desc">${game.desc}</div>
                    <div class="card-footer">
                        <div class="info-row">
                            <span class="info-label">Encryption Style</span>
                            <span class="info-value">${game.category}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">In-Game Job</span>
                            <span class="info-value boosting-target">${game.boosting}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Clock display
        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('system-clock').textContent = timeStr;
        }

        // Active state variables
        let selectedGameId = null;

        // Open Drawer Configurator
        function openConfigurator(gameId) {
            soundSystem.playClick();
            selectedGameId = gameId;
            const game = GAMES.find(g => g.id === gameId);
            
            document.getElementById('drawer-module-title').textContent = game.name;
            document.getElementById('drawer-module-subtitle').textContent = `Calibration // ${game.source.toUpperCase()}`;
            
            // Build Presets Dropdown
            const presetSelect = document.getElementById('preset-select');
            presetSelect.innerHTML = '';
            
            Object.keys(game.presets).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = game.presets[key].name;
                presetSelect.appendChild(opt);
            });

            // Build Sliders
            const slidersContainer = document.getElementById('sliders-container');
            slidersContainer.innerHTML = '';

            if (game.sliders.length === 0) {
                slidersContainer.innerHTML = `<div style="color: var(--text-muted); font-size: 13px; font-style: italic;">
                    No configurable sliders for this hardware emulator. Game uses defaults or fixed inputs.
                </div>`;
            } else {
                game.sliders.forEach(slide => {
                    const sliderGroup = document.createElement('div');
                    sliderGroup.className = 'slider-group';
                    
                    const stepAttr = slide.step ? `step="${slide.step}"` : '';

                    sliderGroup.innerHTML = `
                        <div class="slider-info">
                            <span class="slider-label">${slide.label}</span>
                            <span class="slider-val" id="val-${slide.id}">${slide.default}</span>
                        </div>
                        <input type="range" class="slider-input" id="slider-${slide.id}" 
                            min="${slide.min}" max="${slide.max}" value="${slide.default}" ${stepAttr}
                            oninput="document.getElementById('val-${slide.id}').textContent = this.value">
                    `;
                    slidersContainer.appendChild(sliderGroup);
                });
            }

            // Bind preset change handler
            presetSelect.onchange = () => {
                const presetKey = presetSelect.value;
                const presetConfig = game.presets[presetKey].config;
                
                Object.keys(presetConfig).forEach(field => {
                    const input = document.getElementById(`slider-${field}`);
                    if (input) {
                        input.value = presetConfig[field];
                        document.getElementById(`val-${field}`).textContent = presetConfig[field];
                    }
                });
            };

            // Select the last/first custom preset automatically
            if (presetSelect.options.length > 1) {
                presetSelect.selectedIndex = 1; // Default to the server configuration preset!
                presetSelect.dispatchEvent(new Event('change'));
            }

            // Show Drawer
            document.getElementById('drawer-overlay').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('drawer').classList.add('open');
            }, 10);
        }

        // Close Drawer
        function closeConfigurator() {
            document.getElementById('drawer').classList.remove('open');
            setTimeout(() => {
                document.getElementById('drawer-overlay').style.display = 'none';
            }, 300);
        }

        // Launch Simulation
        function launchGame() {
            soundSystem.playClick();
            closeConfigurator();

            const game = GAMES.find(g => g.id === selectedGameId);
            const iframe = document.getElementById('simulation-iframe');
            
            // Generate configuration payload from sliders
            const config = {};
            game.sliders.forEach(slide => {
                const input = document.getElementById(`slider-${slide.id}`);
                if (input) {
                    // Try parsing numbers
                    const val = parseFloat(input.value);
                    config[slide.id] = isNaN(val) ? input.value : val;
                }
            });

            // Set up src path depending on module source
            let src = '';
            if (game.source === 'glitch') {
                src = 'glitch-minigames/index.html';
            } else if (game.source === 'hacking') {
                src = 'krtshk-hacking/index.html';
            } else if (game.source === 'minigames') {
                src = 'krtshk-minigames/index.html';
            } else if (game.source === 'pulling') {
                src = 'pulling-simulator/index.html';
            }

            iframe.src = src;

            // Show overlay modal
            document.getElementById('modal-overlay').style.display = 'flex';

            // Wait for iframe to load, then dispatch start configurations
            iframe.onload = () => {
                console.log("[Parent] Subgame iframe loaded, sending configs...");
                setTimeout(() => {
                    const win = iframe.contentWindow;
                    if (game.source === 'glitch') {
                        // Glitch minigames use specific action names (e.g. startRhythm)
                        win.postMessage({
                            action: game.action,
                            config: config
                        }, '*');
                    } else if (game.source === 'hacking') {
                        // Krtshk-hacking uses standard action startGame
                        win.postMessage({
                            action: "startGame",
                            game: game.action,
                            settings: config
                        }, '*');
                    } else if (game.source === 'minigames') {
                        // Krtshk-minigames uses standard fields depending on target minigame
                        const payload = { minigame: game.action };
                        
                        // Map settings fields
                        if (game.id === 'scramble') {
                            payload.duration = config.duration * 1000;
                            // Select character groups automatically from preset or fallback
                            const presetVal = document.getElementById('preset-select').value;
                            payload.charGroups = (game.presets[presetVal]?.config?.charGroups) || ["alphabet", "numbers"];
                        } else if (game.id === 'lockpick') {
                            payload.show = true;
                            payload.level = config.level;
                            payload.speed = config.speed;
                            payload.width = 40; // Default wide zone width
                        } else if (game.id === 'memorize') {
                            payload.duration = config.duration;
                            payload.blocks = config.blocks;
                            payload.grid = config.grid;
                        } else if (game.id === 'keystroke') {
                            payload.difficulty = "hard";
                            payload.keys = config.keys;
                        } else if (game.id === 'movingtarget') {
                            payload.timeLimit = config.timeLimit;
                            payload.requiredClicks = config.requiredClicks;
                            payload.autoMoveTime = config.autoMoveTime;
                            payload.shrinkInterval = config.shrinkInterval;
                            payload.shrinkAmount = config.shrinkAmount;
                            payload.targetSize = config.targetSize;
                            payload.target = "🔥";
                        } else if (game.id === 'safecracker') {
                            payload.level = config.level;
                        }
                        
                        win.postMessage(payload, '*');
                    }
                }, 200);
            };
        }

        // Close Simulation Modal
        function closeSimulation() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('outcome-overlay').style.display = 'none';
            document.getElementById('simulation-iframe').src = '';
        }

        // Handle outcomes from minigames inside iframe
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (data.source === 'minigame-callback') {
                console.log("[Parent] Callback intercepted:", data.action, data.payload);
                
                let success = false;
                
                // Identify outcome based on payload action name
                if (data.action.includes('Result') || data.action.includes('endGame') || data.action === 'GameResult') {
                    // Result callbacks e.g. scrambleResult, aimTestResult, mathSum, GameResult
                    success = data.payload.success || false;
                    showOutcome(success);
                } else if (data.action === 'cancelMinigame' || data.action.includes('Close')) {
                    // Close/cancel callbacks
                    closeSimulation();
                }
            }
        });

        // Show outcome screen
        function showOutcome(success) {
            const overlay = document.getElementById('outcome-overlay');
            const title = document.getElementById('outcome-title');
            const subtitle = document.getElementById('outcome-subtitle');
            
            overlay.className = 'outcome-overlay ' + (success ? 'success' : 'failure');
            title.textContent = success ? "Breach Succeeded" : "Connection Severed";
            subtitle.textContent = success ? "Decrypted nodes accessed successfully. Mainframe compromised." : "Firewall countermeasures triggered. Access blocked.";
            
            overlay.style.display = 'flex';
            
            if (success) {
                soundSystem.playSuccess();
            } else {
                soundSystem.playFailure();
            }
        }

        // Trigger manual outcomes for practicing/testing
        document.getElementById('force-success-btn').onclick = () => showOutcome(true);
        document.getElementById('force-failure-btn').onclick = () => showOutcome(false);

        // Bind replay buttons
        document.getElementById('btn-replay').onclick = () => {
            document.getElementById('outcome-overlay').style.display = 'none';
            launchGame();
        };

        document.getElementById('btn-close-outcome').onclick = closeSimulation;
        document.getElementById('close-modal-btn').onclick = closeSimulation;

        // Initialize clock & events
        setInterval(updateClock, 1000);
        updateClock();

        // Bind categories buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                soundSystem.playClick();
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                const search = document.getElementById('search-input').value.toLowerCase();
                renderGames(filter, search);
            };
        });

        // Bind Search Input
        document.getElementById('search-input').oninput = (e) => {
            const activeBtn = document.querySelector('.filter-btn.active');
            const filter = activeBtn ? activeBtn.dataset.filter : 'all';
            const search = e.target.value.toLowerCase();
            renderGames(filter, search);
        };

        // Drawer controllers
        document.getElementById('close-drawer').onclick = closeConfigurator;
        document.getElementById('drawer-overlay').onclick = (e) => {
            if (e.target.id === 'drawer-overlay') closeConfigurator();
        };
        document.getElementById('launch-btn').onclick = launchGame;

        // Initial Render
        renderGames();
    </script>
</body>
</html>
